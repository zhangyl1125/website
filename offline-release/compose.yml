# Image-only deployment. No source code or build toolchain is required.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in images.env}
    pull_policy: never
    container_name: hackhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackhub
      POSTGRES_USER: hackhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hackhub -d hackhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE in images.env}
    pull_policy: never
    container_name: hackhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_INIT_IMAGE:?Set MINIO_INIT_IMAGE in images.env}
    pull_policy: never
    container_name: hackhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: [/bin/sh, /init.sh]
    restart: on-failure

  api:
    image: ${API_IMAGE:?Set API_IMAGE in images.env}
    pull_policy: never
    container_name: hackhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hackhub
      SPRING_DATASOURCE_USERNAME: hackhub
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
      APP_SSO_ENABLED: ${APP_SSO_ENABLED:-false}
      APP_SSO_TENANT_ID: ${APP_SSO_TENANT_ID:-}
      APP_SSO_CLIENT_ID: ${APP_SSO_CLIENT_ID:-}
      APP_SSO_CLIENT_SECRET: ${APP_SSO_CLIENT_SECRET:-}
      APP_SSO_PUBLIC_BASE_URL: ${APP_SSO_PUBLIC_BASE_URL:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in images.env}
    pull_policy: never
    container_name: hackhub-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

# Explicit existing volumes prevent a directory change from creating empty data.
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Set the actual PostgreSQL volume name}
  minio_data:
    external: true
    name: ${MINIO_VOLUME:?Set the actual MinIO volume name}
